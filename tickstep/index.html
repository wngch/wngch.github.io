<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickStep</title>
<style>
  :root{--ink:#1B2838;--muted:#5a6b7b;--accent:#FF6B35;--bg:#F8F6F3;--card:#fff;--line:#e6e1da;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%;}
  .wrap{max-width:680px;margin:0 auto;padding:56px 20px 80px}
  .hero{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .hero .dot{width:44px;height:44px;border-radius:12px;background:var(--accent);flex:0 0 auto}
  .hero h1{font-size:2rem;margin:0;letter-spacing:.01em}
  .tag{color:var(--muted);margin:.2em 0 2em}
  .links{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .links a{display:inline-block;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 18px;color:var(--ink);text-decoration:none;font-weight:600}
  .links a:hover{border-color:var(--accent);color:var(--accent)}
  footer{color:var(--muted);font-size:.85rem;margin-top:48px}
  a.plain{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span class="dot"></span><h1>TickStep</h1></div>
  <p class="tag">メトロノームの BPM でリズムを刻みながら、トレーニングメニューをステップごとに自動進行する iPhone / Apple Watch アプリ。<br>
  A metronome-driven training app for iPhone &amp; Apple Watch that advances your workout flow step by step.</p>

  <div class="links">
    <a href="privacy/">プライバシーポリシー / Privacy Policy</a>
    <a href="support/">サポート / Support</a>
  </div>

  <footer>© 2026 TickStep · <a class="plain" href="../">nononono.jp</a></footer>
</div>
</body>
</html>
