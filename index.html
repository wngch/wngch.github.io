<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nononono.jp</title>
<style>
  :root{--ink:#1B2838;--muted:#5a6b7b;--accent:#FF6B35;--bg:#F8F6F3;--card:#fff;--line:#e6e1da;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%;}
  .wrap{max-width:680px;margin:0 auto;padding:64px 20px 80px}
  h1{font-size:1.6rem;margin:0 0 .2em}
  .tag{color:var(--muted);margin:.2em 0 2.4em}
  h2{font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 .8em}
  .apps{display:flex;flex-direction:column;gap:12px}
  .app{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink)}
  .app:hover{border-color:var(--accent)}
  .app .dot{width:34px;height:34px;border-radius:10px;background:var(--accent);flex:0 0 auto}
  .app .name{font-weight:700}
  .app .desc{color:var(--muted);font-size:.9rem}
  footer{color:var(--muted);font-size:.85rem;margin-top:56px}
</style>
</head>
<body>
<div class="wrap">
  <h1>nononono.jp</h1>
  <p class="tag">個人開発のアプリとプロジェクト。<br>Apps and projects by an independent developer.</p>

  <h2>Apps</h2>
  <div class="apps">
    <a class="app" href="tickstep/">
      <span class="dot"></span>
      <span>
        <span class="name">TickStep</span><br>
        <span class="desc">メトロノーム連動トレーニングアプリ（iPhone / Apple Watch）</span>
      </span>
    </a>
  </div>

  <footer>© 2026 nononono.jp</footer>
</div>
</body>
</html>
